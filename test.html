<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8' />
<meta name='viewport' content='width=device-width, initial-scale=1.0'/>
<title>Custom SVG Chart</title>
<style>
  body{
    margin:0;
    padding:20px;
    background:#0f172a;
    font-family:Arial,sans-serif;
    color:white;
  }

  .chart-container{
    width:100%;
    max-width:1000px;
    margin:auto;
    background:#111827;
    border-radius:16px;
    padding:20px;
  }

  svg{
    width:100%;
    height:auto;
    display:block;
  }

  .grid{
    stroke:#334155;
    stroke-width:1;
  }

  .axis{
    stroke:#64748b;
    stroke-width:2;
  }

  .line{
    fill:none;
    stroke:#3b82f6;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .point{
    fill:#60a5fa;
    stroke:#0f172a;
    stroke-width:2;
  }

  .label{
    fill:#cbd5e1;
    font-size:12px;
  }

  .title{
    fill:white;
    font-size:22px;
    font-weight:bold;
  }
</style>
</head>
<body>

<div class='chart-container'>
  <svg id='chart' viewBox='0 0 1000 500' preserveAspectRatio='xMidYMid meet'></svg>
</div>

<script>
const data = [
  { amount: 5000, createdAt: '2025-12-04' },
  { amount: 6125, createdAt: '2025-12-10' },
  { amount: 9200, createdAt: '2025-12-18' },
  { amount: 50, createdAt: '2025-12-23' },
  { amount: 100, createdAt: '2025-12-23' },
  { amount: 150, createdAt: '2025-12-23' },
  { amount: 200, createdAt: '2025-12-23' },
  { amount: 250, createdAt: '2025-12-23' },
  { amount: 300, createdAt: '2025-12-23' },
  { amount: 350, createdAt: '2025-12-23' },
  { amount: 400, createdAt: '2025-12-23' },
  { amount: 9200, createdAt: '2025-12-23' },
  { amount: 9200, createdAt: '2025-12-25' },
  { amount: 6125, createdAt: '2025-12-31' },
  { amount: 24500, createdAt: '2026-01-03' },
  { amount: 10000, createdAt: '2026-01-10' },
  { amount: 5000, createdAt: '2026-01-26' },
  { amount: 12250, createdAt: '2026-02-07' },
  { amount: 12250, createdAt: '2026-04-04' },
  { amount: 34375, createdAt: '2026-04-08' },
  { amount: 76250, createdAt: '2026-04-23' },
  { amount: 50, createdAt: '2026-05-21' },
  { amount: 50, createdAt: '2026-05-21' },
  { amount: 50, createdAt: '2026-05-21' },
  { amount: 50, createdAt: '2026-05-21' },
  { amount: 50, createdAt: '2026-05-21' },
  { amount: 70000, createdAt: '2026-06-08' },
  { amount: 147000, createdAt: '2026-07-02' },
];

const svg = document.getElementById('chart');

const width = 1000;
const height = 500;
const padding = 70;
const chartWidth = width - padding * 2;
const chartHeight = height - padding * 2;

const maxAmount = Math.max(...data.map(d => d.amount));

// Draw title
svg.innerHTML += `
  <text x='70' y='40' class='title'>Revenue Chart</text>
`;

// Draw horizontal grid + Y labels
const steps = 5;

for(let i = 0; i <= steps; i++){

  const value = (maxAmount / steps) * i;

  const y = padding + chartHeight - (value / maxAmount) * chartHeight;

  svg.innerHTML += `
    <line
      x1='${padding}'
      y1='${y}'
      x2='${width - padding}'
      y2='${y}'
      class='grid'
    />

    <text
      x='20'
      y='${y + 5}'
      class='label'
    >
      ${Math.round(value).toLocaleString()}
    </text>
  `;
}

// Draw axes
svg.innerHTML += `
  <line
    x1='${padding}'
    y1='${padding}'
    x2='${padding}'
    y2='${height - padding}'
    class='axis'
  />

  <line
    x1='${padding}'
    y1='${height - padding}'
    x2='${width - padding}'
    y2='${height - padding}'
    class='axis'
  />
`;

// Convert data to chart points
const points = data.map((item, index) => {

  const x =
    padding +
    (index / (data.length - 1)) * chartWidth;

  const y =
    padding +
    chartHeight -
    (item.amount / maxAmount) * chartHeight;

  return { x, y, ...item };
});

// Create SVG path
const pathData = points
  .map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`)
  .join(' ');

// Draw line
svg.innerHTML += `
  <path d='${pathData}' class='line'/>
`;

// Draw points
points.forEach(point => {

  svg.innerHTML += `
    <circle
      cx='${point.x}'
      cy='${point.y}'
      r='5'
      class='point'
    >
      <title>
        ${point.amount.toLocaleString()} MAD
        (${point.createdAt})
      </title>
    </circle>
  `;
});

// X-axis labels
const monthLabels = [
  { index: 0, label: 'Dec' },
  { index: 14, label: 'Jan' },
  { index: 17, label: 'Feb' },
  { index: 18, label: 'Apr' },
  { index: 21, label: 'May' },
  { index: 26, label: 'Jun' },
  { index: 27, label: 'Jul' },
];

monthLabels.forEach(m => {

  const p = points[m.index];

  svg.innerHTML += `
    <text
      x='${p.x}'
      y='${height - 25}'
      text-anchor='middle'
      class='label'
    >
      ${m.label}
    </text>
  `;
});
</script>

</body>
</html>
