<div class="login-container">
  <form id="login_form" class="login-card">
    
    <div class="form_Header">
      <h1>Welcome Back</h1>
      <p>Log in to track your progress</p>
    </div>

    <!-- Container for dynamic error messages from JS -->
    <p id="error_message" class="error-msg"></p>

    <div class="form-inputs">
      <div class="input_field input_username">
        <label for="username">Username or Email</label>
        <input 
          id="username" 
          name="username" 
          type="text" 
          placeholder="e.g. joe or joe@example.com" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="input_field input_pass">
        <label for="pass">Password</label>
        <input
          id="pass"
          name="password"
          type="password"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        />
      </div>
    </div>

    <button type="submit" class="submit-btn">
      <span>Log In</span>
    </button>

  </form>
</div>
